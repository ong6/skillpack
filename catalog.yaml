# Catalog data for README.md. `python3 scripts/build-catalog.py` regenerates the tables from this
# file plus each skill's SKILL.md frontmatter. Categories are ordered as they appear; each skill
# sits in exactly one. `bin/skills` reads the same file for `category:<key>` selectors, so keep
# `skills:` as a flow list (`[a, b]`) or a block list (`- a`).
skill_summaries:
  web-extract: Read, search and scrape difficult web pages through Firecrawl.
  youtube-transcript: Fetch clean captions from a YouTube video.
  system-diagram: Turn a real system flow into a polished, readable SVG figure.
  3d-design: Choose the right authoring and browser workflow for a 3D object or animation.
  blender-authoring: Build, animate, render and export Blender scenes with Python.
  markdown-to-pdf: Turn a Markdown note into a checked, print-ready A4 PDF.
  handoff: Leave a compact continuation brief for the next agent or session.
  feedback-loop: Record feedback and patch the skill or rule that caused it in the same session.
  refine: Review and improve the work until its constraints and requested score pass.
  save-video: File a YouTube video as a searchable note with takeaways, category and tags.
  datastore: Keep structured records as append-only JSONL with a local SQLite cache for SQL.
  write-a-brief: Write or tighten a one-to-two-page brief for a meeting with a professional.
  review-a-quote: Review a vendor or construction quote line by line and separate what to ask now.
  ux-design: Audit or design a page's UX against a usability checklist before visual polish.
  trip-planner: Plan or replan a trip with live research on routes, hours, parking and food.
  product-shopping: Decide what to buy, or find the best legitimate price for a chosen model.
  compare-price: Compare one product's landed cost across countries in a single currency.
  evaluate-condo: Evaluate a Singapore condo listing or development and file a cited verdict.
  teach: Run a stateful, multi-session course on a topic in a learning workspace.
  interview-prep: Mock interviews from your own resume, with spoken-plan grading, drills, debriefs, system design.
  create-fde-deck: "Write evidence-labelled field-engineering decks: discovery, architecture, pilot readout."
  review-fde-deck: Audit a field-engineering deck for logic, evidence, honesty, density and next steps.
  track-pilot-evidence: Track pilot criteria, evidence and risks where agents propose and humans decide.
  skillsmith: Make a skill from the repo, then keep it only if it beats the same model without it.
  skill-search: Find a skill for a job across loaded, rarely used, retired and external skills.


# Skills tidy never shelves (bin/skills moves skills idle for 30 days to rarely-used/).
pinned: [skill-search]

