name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python3 scripts/build-catalog.py --check
      - run: python3 scripts/check-names.py
      - run: python3 scripts/test-names.py
      - run: python3 scripts/test-catalog.py
      - run: bash scripts/test-sync.sh
